name = "crewroster-proxy"
main = "worker.js"
compatibility_date = "2024-09-01"

# Configuração (CREWLINK_BASE / ALLOWED_ORIGINS) está hardcoded em worker.js —
# o ficheiro é autónomo para poder ser colado no dashboard sem variáveis.

# Limites de pedidos (revisão de segurança, nov. 2026) — o worker funciona sem eles (overLimit em worker.js).
# LOGIN_LIMITER: 5 logins por minuto por IP + código de tripulante (contra tentativas de passwords no NetLine).
# API_LIMITER: 120 pedidos por minuto por IP em todo o /api/* (quota da AeroDataBox, relays).
[[unsafe.bindings]]
name = "LOGIN_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "API_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
