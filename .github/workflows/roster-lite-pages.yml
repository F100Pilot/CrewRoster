name: Deploy roster-lite to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['roster-lite/**', '.github/workflows/roster-lite-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

# Production and the experimental preview publish to the same gh-pages branch: one at a time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roster-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roster-lite/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "Pillow==11.0.0" --quiet
      - run: python3 scripts/gen-icons.py
        working-directory: roster-lite
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BASE: /CrewRoster/
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      # The whole site — this build at the root, the experimental preview (/exp/) as it is
      # published — without keeping old files: keep_files left every past build's hashed assets on
      # the branch (3 000 files, 168 MB, a 61 MB Pages artifact per deploy, eating the Actions
      # storage quota).
      - name: Assemble the site (this build + the published preview)
        run: |
          # From the repository root: run in roster-lite/, git archive would only take that subfolder.
          git -C .. fetch --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          mkdir -p ../site
          cp -r dist/. ../site/
          if git -C .. cat-file -e origin/gh-pages:exp/index.html; then
            git -C .. archive origin/gh-pages exp | tar -x -C ../site
          fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: false
