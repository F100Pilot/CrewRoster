name: Deploy roster-lite EXPERIMENTAL preview

# Builds the experimental branch and publishes it to a SEPARATE subpath of the same
# GitHub Pages site, so it can be tested without touching production:
#   https://f100pilot.github.io/CrewRoster/exp/
# The service worker is disabled (DISABLE_PWA=1) so testers always get the latest build.

on:
  push:
    branches: [claude/crew-per-flight]
    paths: ['roster-lite/**', '.github/workflows/roster-lite-pages-exp.yml']
  workflow_dispatch:

permissions:
  contents: write

# Production and this preview publish to the same gh-pages branch: one at a time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roster-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roster-lite/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "Pillow==11.0.0" --quiet
      - run: python3 scripts/gen-icons.py
        working-directory: roster-lite
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BASE: /CrewRoster/exp/
          DISABLE_PWA: '1'
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # OAuth client id for "Enviar para o Google Calendar" (public by nature; unset = feature hidden).
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      # The whole site — production as it is published, this build under exp/ — published without
      # keeping old files: keep_files left every past build's hashed assets on the branch (3 000
      # files, 168 MB, a 61 MB Pages artifact per deploy, eating the Actions storage quota).
      - name: Assemble the site (published production + this preview)
        run: |
          # From the repository root: run in roster-lite/, git archive would only take that subfolder.
          git -C .. fetch --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          mkdir -p ../site
          git -C .. archive origin/gh-pages | tar -x -C ../site
          # Never publish a site without production: stop if the root came out empty.
          test -f ../site/index.html
          rm -rf ../site/exp
          cp -r dist ../site/exp
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: false
